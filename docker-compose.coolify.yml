version: '3'

services:
  backend:
    image: ${COOLIFY_REGISTRY_URL}/nds-sorting-backend:${COOLIFY_TAG}
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: nds-sorting-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./Scores with Names.csv:/app/Scores with Names.csv
    environment:
      - GOOGLE_SEARCH_API_KEY=${GOOGLE_SEARCH_API_KEY}
      - GOOGLE_SEARCH_CX=${GOOGLE_SEARCH_CX}
    restart: unless-stopped
    networks:
      - nds-network
    labels:
      "coolify.managed": "true"

  frontend:
    image: ${COOLIFY_REGISTRY_URL}/nds-sorting-frontend:${COOLIFY_TAG}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: "production"
        VITE_API_BASE_URL: "${BACKEND_URL:-http://backend:8000}/api"
    container_name: nds-sorting-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=${BACKEND_URL:-http://backend:8000}/api
    restart: unless-stopped
    networks:
      - nds-network
    labels:
      "coolify.managed": "true"

networks:
  nds-network:
    driver: bridge 